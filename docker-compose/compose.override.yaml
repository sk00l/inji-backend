services:
  mimoto-service:
    restart: unless-stopped
    image: mimoto:local
    build:
      context: ..
    mem_limit: 850m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx448m -Djavax.net.ssl.trustStore=/home/mosip/certs/local-cacerts -Djavax.net.ssl.trustStorePassword=changeit
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/home/mosip/local-auth.properties
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - ./local/local-auth.properties:/home/mosip/local-auth.properties:ro
      - ./certs/local-cacerts:/home/mosip/certs/local-cacerts:ro
    depends_on:
      - nginx
      - keycloak

  datashare:
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 600m
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m

  minio:
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - minio-data:/data

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    mem_limit: 700m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      KC_HOSTNAME: http://localhost:8080
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx256m
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./local/inji-local-realm.json:/opt/keycloak/data/import/inji-local-realm.json:ro
      - keycloak-data:/opt/keycloak/data

  inji-web:
    restart: unless-stopped
    image: inji-web:local
    build:
      context: ../../inji-web/inji-web
      dockerfile: Dockerfile.local
    ports:
      - 127.0.0.1:3004:3004
    volumes:
      - ./local/web-env.config.js:/usr/share/nginx/html/env.config.js:ro
      - ./local/web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mimoto-service

  postgres:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    volumes:
      - ./university/student-card-template.html:/config/server/University-StudentIDCredential-template.html:ro

  demo-verifier:
    image: inji-university-demo:local
    build:
      context: ./university
    command: node verifier.mjs
    restart: unless-stopped
    mem_limit: 350m
    environment:
      BASE_URL: https://verifier.localhost
      BROWSER_URL: http://localhost:3000
      NODE_OPTIONS: --max-old-space-size=96
      NODE_EXTRA_CA_CERTS: /tls/local-ca.pem
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - university-verifier-data:/data
      - ./certs/verifier-ca.pem:/tls/local-ca.pem:ro

  university-issuer:
    image: inji-university-demo:local
    build:
      context: ./university
    restart: unless-stopped
    mem_limit: 350m
    ports:
      - 127.0.0.1:3006:3006
    networks:
      default:
        aliases:
          - university.localhost
    volumes:
      - university-issuer-data:/data
      - ./certs/university-client-public.jwk:/keys/university-client-public.jwk:ro
      - ./certs/university.pem:/tls/university.pem:ro
      - ./certs/university.key:/tls/university.key:ro

  verifier-tls:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - verifier.localhost
    volumes:
      - ./local/verifier-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/verifier.pem:/certs/verifier.pem:ro
      - ./certs/verifier.key:/certs/verifier.key:ro
    depends_on:
      - demo-verifier

volumes:
  minio-data:
  keycloak-data:
  university-issuer-data:
  university-verifier-data:
