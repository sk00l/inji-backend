# Independent mobile development project. Generated settings/certs stay local.
name: inji-mobile-dev
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./mimoto_init.sql:/docker-entrypoint-initdb.d/mimoto_init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d inji_mimoto']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: mosipint/minio:2022.2.7-debian-10-r0
    platform: linux/amd64
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      default:
        aliases: [minio-service]
    restart: unless-stopped

  datashare:
    image: mosipid/data-share-service:1.3.0-beta.2
    platform: linux/amd64
    mem_limit: 600m
    environment:
      active_profile_env: inji-default,standalone
      SPRING_CONFIG_NAME: data-share
      SPRING_CONFIG_LOCATION: /home/mosip/
      DATASHARE_DOMAIN: datashare:8097
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    volumes:
      - ./config/data-share-inji-default.properties:/home/mosip/data-share-inji-default.properties:ro
      - ./config/data-share-standalone.properties:/home/mosip/data-share-standalone.properties:ro
    depends_on: [minio]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./mobile-runtime/server:/config/server:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    mem_limit: 700m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx256m
    volumes:
      - ./local/inji-local-realm.json:/opt/keycloak/data/import/inji-local-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  mimoto-service:
    image: mimoto:mobile-local
    build:
      context: ..
      dockerfile: docker-compose/local/backend.Dockerfile
    mem_limit: 850m
    environment:
      active_profile_env: default
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_NAME: mimoto
      SPRING_CONFIG_LOCATION: /home/mosip/
      SPRING_CLOUD_BOOTSTRAP_LOCATION: /home/mosip/mimoto-bootstrap.properties
      SPRING_CLOUD_CONFIG_LABEL: local
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/home/mosip/local-auth.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inji_mimoto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GOOGLE_OAUTH_CLIENT_ID: unused-local-placeholder
      GOOGLE_OAUTH_CLIENT_SECRET: unused-local-placeholder
      oidc_p12_password: dummypassword
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx448m -Djavax.net.ssl.trustStore=/home/mosip/certs/local-cacerts -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - ./mobile-runtime/server/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./config/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties:ro
      - ./mobile-runtime/server/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./mobile-runtime/server/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ./mobile-runtime/local-auth.properties:/home/mosip/local-auth.properties:ro
      - ./mobile-runtime/certs:/home/mosip/certs
    depends_on:
      postgres:
        condition: service_healthy
      nginx:
        condition: service_started
      keycloak:
        condition: service_started
      datashare:
        condition: service_started
    restart: unless-stopped

  university-issuer:
    image: inji-university-demo:mobile-local
    build: ./university
    environment:
      ISSUER_URL: ${INJI_PUBLIC_ORIGIN:?Run mobile-stack.sh init first}/issuer
      ISSUER_CLIENT_ID: university-mobile
      ISSUER_REDIRECT_URI: io.mosip.residentapp.inji://oauthredirect
      ISSUER_PUBLIC_CLIENT: 'true'
      ISSUER_AUTHORIZATION_URL: ${INJI_PUBLIC_ORIGIN}/issuer/authorize
      ISSUER_LOGO_URL: ${INJI_PUBLIC_ORIGIN}/issuer/static/seal.svg
    volumes:
      - university-issuer-data:/data
      - ./mobile-runtime/certs/university-client-public.jwk:/keys/university-client-public.jwk:ro
      - ./mobile-runtime/certs/university.pem:/tls/university.pem:ro
      - ./mobile-runtime/certs/university.key:/tls/university.key:ro
    mem_limit: 350m
    restart: unless-stopped

  demo-verifier:
    image: inji-university-demo:mobile-local
    build: ./university
    command: node verifier.mjs
    environment:
      ISSUER_URL: ${INJI_PUBLIC_ORIGIN}/issuer
      BASE_URL: ${INJI_PUBLIC_ORIGIN}
      BROWSER_URL: ${INJI_PUBLIC_ORIGIN}
      MOBILE_DEMO: 'true'
      ISSUER_LOGO_URL: ${INJI_PUBLIC_ORIGIN}/issuer/static/seal.svg
      NODE_EXTRA_CA_CERTS: /tls/local-ca.pem
      NODE_OPTIONS: --max-old-space-size=96
    volumes:
      - university-verifier-data:/data
      - ./mobile-runtime/certs/verifier-ca.pem:/tls/local-ca.pem:ro
    mem_limit: 350m
    restart: unless-stopped

  mobile-gateway:
    image: nginx:alpine
    ports:
      - '${INJI_GATEWAY_BIND:-0.0.0.0}:${INJI_GATEWAY_PORT:-8443}:443'
    volumes:
      - ./mobile-runtime/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mobile-runtime/certs/gateway.pem:/tls/gateway.pem:ro
      - ./mobile-runtime/certs/gateway.key:/tls/gateway.key:ro
    depends_on: [mimoto-service, university-issuer, demo-verifier]
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  keycloak-data:
  university-issuer-data:
  university-verifier-data:
