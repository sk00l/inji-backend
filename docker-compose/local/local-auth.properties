# Local development login via Keycloak; Google configuration stays separate.
# This stack uses Caffeine, so an absent Redis is not a health failure.
management.health.redis.enabled=false
# The library's HSM probe expects a KERNEL symmetric HSM key. This local stack
# uses PKCS12 RSA keys, validated during Mimoto startup and wallet operations.
mosip.kernel.keymgr.hsm.health.check.enabled=false
# The Collab Mock issuer now implements OpenID4VCI 1.0 final.
mosip.inji.openid4vci.final-issuers=Mock,University
spring.security.oauth2.client.registration.local.client-id=inji-web
spring.security.oauth2.client.registration.local.client-secret=local-web-secret
spring.security.oauth2.client.registration.local.provider=local
spring.security.oauth2.client.registration.local.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.local.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.local.scope=openid,profile,email
spring.security.oauth2.client.registration.local.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.local.client-name=Local development account
spring.security.oauth2.client.provider.local.authorization-uri=http://localhost:8080/realms/inji-local/protocol/openid-connect/auth
spring.security.oauth2.client.provider.local.token-uri=http://keycloak:8080/realms/inji-local/protocol/openid-connect/token
spring.security.oauth2.client.provider.local.user-info-uri=http://keycloak:8080/realms/inji-local/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.local.jwk-set-uri=http://keycloak:8080/realms/inji-local/protocol/openid-connect/certs
spring.security.oauth2.client.provider.local.user-name-attribute=sub
spring.security.oauth2.client.provider.local.userNameAttribute=sub
spring.security.oauth2.client.provider.local.nameAttribute=name
spring.security.oauth2.client.provider.local.emailAttribute=email
spring.security.oauth2.client.provider.local.pictureAttribute=picture
spring.security.oauth2.client.provider.local.phoneNumberAttribute=phone_number
