server {
    listen 443 ssl;
    server_name verifier.localhost;
    ssl_certificate /certs/verifier.pem;
    ssl_certificate_key /certs/verifier.key;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $verifier_backend demo-verifier:3000;
        proxy_pass http://$verifier_backend;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }
}
